name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct verified resource package
        run: python3 tools/assemble_site.py
      - name: Verify published files without starting the game
        run: python3 tools/verify_site.py
      - name: Check JavaScript syntax only
        run: |
          node --check site/index.js
          node --check site/isolation-sw.js
          node tools/verify_desktop_pixel_fit.cjs

  deploy:
    # Public Pages hosting was authorized by the repository owner.
    if: ${{ !github.event.repository.private }}
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct verified resource package
        run: python3 tools/assemble_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        id: upload
        with:
          path: site
      - name: Wait for uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID"
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
                --jq '.artifacts[] | select(.expired == false) | .id' | grep -Fxq -- "$ARTIFACT_ID"; then
              exit 0
            fi
            sleep 5
          done
          echo "The uploaded Pages artifact is still missing from this workflow run." >&2
          exit 1
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
