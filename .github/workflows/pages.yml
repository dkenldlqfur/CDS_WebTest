name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct verified resource package
        run: python3 tools/assemble_site.py
      - name: Verify published files without starting the game
        run: python3 tools/verify_site.py
      - name: Check JavaScript syntax only
        run: |
          node --check site/index.js
          node --check site/isolation-sw.js
          node tools/verify_desktop_pixel_fit.cjs

  deploy:
    # Public Pages hosting was authorized by the repository owner.
    if: ${{ !github.event.repository.private }}
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct verified resource package
        run: python3 tools/assemble_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        id: upload
        with:
          path: site
      - name: Wait for uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID"
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
                --jq '.artifacts[] | select(.expired == false) | .id' | grep -Fxq -- "$ARTIFACT_ID"; then
              exit 0
            fi
            sleep 5
          done
          echo "The uploaded Pages artifact is still missing from this workflow run." >&2
          exit 1
      - name: Publish
        id: deployment
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          retries: 3
          script: |
            // Use the upload's exact artifact ID: the runner-scoped artifact
            // listing can be empty even when GitHub's REST API has the file.
            const artifactId = process.env.PAGES_ARTIFACT_ID;
            if (!/^\d+$/.test(artifactId || '')) throw new Error('Missing Pages artifact ID');
            const repo = context.repo;
            const artifact = await github.rest.actions.getArtifact({ ...repo, artifact_id: Number(artifactId) });
            if (artifact.data.expired || artifact.data.workflow_run?.head_sha !== context.sha) {
              throw new Error('The Pages artifact does not belong to this commit');
            }
            const created = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...repo, artifact_id: Number(artifactId), pages_build_version: context.sha,
              oidc_token: await core.getIDToken()
            });
            const deploymentId = created.data.id || created.data.status_url?.split('/').pop() || context.sha;
            core.setOutput('page_url', created.data.page_url);
            const terminal = new Set(['deployment_failed', 'deployment_perms_error',
              'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']);
            for (let attempt = 0; attempt < 120; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const result = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {
                ...repo, deploymentId
              });
              core.info(`Pages deployment: ${result.data.status}`);
              if (result.data.status === 'succeed') return;
              if (terminal.has(result.data.status)) throw new Error(`Pages deployment: ${result.data.status}`);
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', {
              ...repo, deploymentId
            });
            throw new Error('Pages deployment timed out');
